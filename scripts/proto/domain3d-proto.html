<!--
  ============================================================================
  E-4 性能原型（2026-11-25）
  ============================================================================

  ## 这个原型**只回答一个问题**

  合批之后，30 个恒星系 + 航道 + 星域边界的域内 3D，能不能跑到 30fps 以上？

  不做的事（刻意）：不接产品、不改数据、不做交互细节、不做美观。
  交互只有：拖拽旋转 / 滚轮缩放（够验证帧率）。命中与点选留到正式实现。

  ## 为什么要单独做原型

  当年搁置 E-4 的理由就是"性能"。而性能的真实瓶颈是 **draw call 数**，不是顶点数 ——
  30 个恒星系 × 每系一个 Mesh + 每条航道一个 Line = 几百个 draw call，星域一多必掉帧。
  合批之后是 3 批（恒星 InstancedMesh / 航道 LineSegments / 边界 LineSegments）。

  所以这个原型要**同时量两件事**：
    ① 合批版（3 批）的实际帧率
    ② 逐对象版（N 批）的实际帧率 —— 这是**对照组**，没有它就无法证明合批有用

  对照组是必需的：只量合批版、然后看到一个不错的数字，不能证明"是合批带来的改善"，
  也可能是"这台机器本来就快、逐对象也不慢"。**没有对照就没有结论。**

  ## 怎么跑

  直接双击打开（file:// 即可，不需要起服务器），或：
    python -m http.server 8080  →  http://localhost:8080/build/proto-domain3d/domain3d-proto.html

  需要能加载 three（走 CDN；离线时请把 three 放到同目录并改 importmap）。
  页面里点"开始量"→ 自动跑两轮各 5 秒 → 出对照表。
-->

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js"
  }
}
</script>

<script type="module">
// ═══════════════════════════════════════════════════════════════════════════
// 0. 基础设施
// ═══════════════════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const LOG = $('log');
function log(msg, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  LOG.appendChild(d);
  LOG.scrollTop = LOG.scrollHeight;
}

/** 与产品侧同一份稳定哈希（避免原型和产品两套 z 规则） */
function stableHash01(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h / 4294967296;
}

/** 确定性 PRNG（mulberry32）—— 原型**禁止 Math.random**，否则两次跑的数据不一样，量的数没意义 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// 1. 造一份"一个星域"的假数据
//    ⚠️ 形状与 domain3dScene.js 的输入完全一致 —— 原型验的必须是真形状，
//       否则量出来的数字不能外推到产品。
// ═══════════════════════════════════════════════════════════════════════════
function makeDomainFixture(opts = {}) {
  const count = opts.stars ?? 30;            // 默认 30：A 档 120 星 ÷ 4 势力
  const radius = opts.radius ?? 900;
  const seed = opts.seed ?? 20261125;
  const rnd = mulberry32(seed);

  const stars = [];
  for (let i = 0; i < count; i++) {
    // 极坐标撒点，内密外疏（与生成器的盘面观感一致）
    const u = rnd();
    const rr = radius * Math.sqrt(u) * 0.92;
    const ang = rnd() * Math.PI * 2;
    stars.push({
      id: `d31|star_${i}`,
      name: `星${i + 1}`,
      x: Math.cos(ang) * rr,
      y: Math.sin(ang) * rr,
    });
  }

  // 航道：最近邻 + 少量成环（够密，能代表真实拓扑的量级）
  const laned = new Set();
  const lanes = [];
  for (let i = 0; i < stars.length; i++) {
    const a = stars[i];
    // 找最近的两个邻居
    const near = stars
      .map((b, j) => ({ j, d: j === i ? Infinity : Math.hypot(b.x - a.x, b.y - a.y) }))
      .sort((p, q) => p.d - q.d)
      .slice(0, 2);
    for (const n of near) {
      const b = stars[n.j];
      const key = a.id < b.id ? `${a.id}|${b.id}` : `${b.id}|${a.id}`;
      if (laned.has(key)) continue;
      // 太长的边不要（否则星域图变成蜘蛛网）
      if (n.d > radius * 0.45) continue;
      laned.add(key);
      lanes.push({ id: `hl_${lanes.length}`, from: a.id, to: b.id });
    }
  }

  // 星域边界：一圈圆（真实现里来自 territory.js 的 φ 场轮廓）
  const pts = [];
  for (let i = 0; i < 48; i++) {
    const t = (i / 48) * Math.PI * 2;
    const wob = 1 + 0.06 * Math.sin(t * 3 + 1.2);
    pts.push({ x: Math.cos(t) * radius * 1.02 * wob, y: Math.sin(t) * radius * 1.02 * wob });
  }

  return { domain: { id: 'd31', name: '原型星域' }, stars, hyperlanes: lanes, borders: [{ points: pts }], radius };
}

// ═══════════════════════════════════════════════════════════════════════════
// 2. 场景数据（与 domain3dScene.js 同算法；原型内联一份，避免依赖构建）
// ═══════════════════════════════════════════════════════════════════════════

// ── 用户 2026-11-25 拍板的三条口径 ────────────────────────────────────────
// ① 从 3D 域内点进单系后，**返回时保持原相机**（不重置）→ 见 cameraMemory
// ② 星域边界在 3D 里是**平面切片**（z=0 上的一张轮廓，不是立体体积）→ 见边框 & 切片面
// ③ 恒星系 z 分布**近似平面只做薄层** → Z_THICKNESS 从 0.18 收到 0.06
const Z_THICKNESS = 0.06;
// 恒星半径：用户 2026-11-25 指出「恒星太大了」。
// 群星实测 4~6px 带光晕（`refs/src/星域视图4.png` / `星链接线1.jpg` 在 1920 宽下量的）。
// 20 太大；6 在 1280 宽视口里对应约 5px 屏幕直径，与参考图同量级。
const STAR_RADIUS = 6;

// ── 观感口径：全部来自 `refs/MANIFEST.md` 已记录的实测量 + 2D 侧既有实现 ──────
// ⚠️ 这些数**不是新编的**：
//   · 色温五类的色值与权重直接抄 `galaxy/starArt.js#STAR_CLASSES`（白/蓝白/黄白/橙/红，
//     权重 0.30/0.25/0.20/0.15/0.10）—— 2D 画布与 3D 必须同一个口径，
//     否则同一个星域在 2D 是黄白、切到 3D 变蓝白（"同一个东西两种画法"是本仓反复出现的坑）。
//   · 光晕、航道色、边界三层宽度来自 MANIFEST 对群星参考图的逐项测量。
const STAR_CLASSES = [
  { tint: '#f5f8ff', w: 0.30 },   // 白
  { tint: '#cfe0ff', w: 0.25 },   // 蓝白
  { tint: '#fff3d6', w: 0.20 },   // 黄白
  { tint: '#ffd9a0', w: 0.15 },   // 橙
  { tint: '#ffb9a3', w: 0.10 },   // 红
];
/** 与 `starArt.js#starTintOf` 同算法同权重：同 id 永远同色温 */
function starTintOf(id) {
  const h = stableHash01(String(id || '') + '|7');   // 与 hash01(id, 7) 同口径
  let acc = 0;
  for (const c of STAR_CLASSES) {
    acc += c.w;
    if (h < acc) return c.tint;
  }
  return STAR_CLASSES[0].tint;
}

// 航道：MANIFEST 记「只有一种青色（约 #4fd6d6），靠明暗分主次，不按类型换色」
const LANE_COLOR = '#4fd6d6';
// 边界：MANIFEST 记「厚带双线结构：内 1px 亮线 + 外柔光 8~12px」
const BORDER_INNER = '#ffd479';
const BORDER_GLOW = '#c8a24a';
const BORDER_FILL = '#2a5a7a';

function buildScene(fx) {
  const zHalf = Z_THICKNESS * fx.radius;
  const ids = [], names = [], pos = new Float32Array(fx.stars.length * 3);
  fx.stars.forEach((s, i) => {
    ids.push(s.id); names.push(s.name);
    pos[i * 3] = s.x; pos[i * 3 + 1] = s.y;
    pos[i * 3 + 2] = (stableHash01(s.id) * 2 - 1) * zHalf;
  });

  const idx = new Map(ids.map((id, i) => [id, i]));
  const seen = new Set();
  const lanePos = [];
  for (const hl of fx.hyperlanes) {
    if (!idx.has(hl.from) || !idx.has(hl.to) || hl.from === hl.to) continue;
    const key = hl.from < hl.to ? `${hl.from}|${hl.to}` : `${hl.to}|${hl.from}`;
    if (seen.has(key)) continue;
    seen.add(key);
    const a = idx.get(hl.from), b = idx.get(hl.to);
    lanePos.push(pos[a * 3], pos[a * 3 + 1], pos[a * 3 + 2]);
    lanePos.push(pos[b * 3], pos[b * 3 + 1], pos[b * 3 + 2]);
  }

  const borders = fx.borders.map((b) => {
    const arr = [];
    for (const p of b.points) arr.push(p.x, p.y, 0);
    arr.push(b.points[0].x, b.points[0].y, 0);
    return new Float32Array(arr);
  });

  return {
    ids, names, starPos: pos,
    lanePos: new Float32Array(lanePos),
    borders,
    counts: {
      stars: fx.stars.length,
      laneSegments: lanePos.length / 6,
      borders: borders.length,
      drawCallsIfBatched: 3,
      drawCallsIfNaive: fx.stars.length + (lanePos.length / 6) + borders.length,
    },
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// 3. three 初始化
// ═══════════════════════════════════════════════════════════════════════════
let THREE, OrbitControls;
let renderer, scene, camera, controls;
let batchedGroup = null, naiveGroup = null;
let mode = 'batched';
let disposed = [];

function makeStarGeometry() {
  // 低段数：域内总览看不见多边形边界，但段数直接乘实例数
  return new THREE.SphereGeometry(STAR_RADIUS, 12, 8);
}
// 注：曾有一个 `makeGlowTexture()`（给 Sprite 用的径向渐变贴图）。
// v3 改成 `Points` + 自定义 shader 后不再需要 —— 渐变改在片元里用 `gl_PointCoord` 算，
// 少一张贴图、少一次上传。删掉而不是留着，避免下次有人以为还得用它。

// ── 合批版：3 批 ─────────────────────────────────────────────────────────
function buildBatched(sc) {
  const g = new THREE.Group();

  // ① 恒星：**按色温分组合批**（观感：色温五类，MANIFEST + starArt.js 的既有口径）
  //
  // 为什么按色温分组而不是给每个 instance 设 instanceColor：
  //   `InstancedMesh.setColorAt` 在 three 0.128 里能用，但它要求材质本身走 instanceColor 分支，
  //   与"每类一个 MeshLambertMaterial"相比**观感没差别、代码更容易出岔**。
  //   五类 = 5 个 InstancedMesh = 5 次 draw call，仍然是与星数无关的常数。
  //   （总批数从 3 变成 5+2=7，依然远低于 N1 的 <50 判据。）
  const geo = makeStarGeometry();
  const byTint = new Map();   // tint -> [positions]
  for (let i = 0; i < sc.counts.stars; i++) {
    const tint = starTintOf(sc.ids[i]);
    if (!byTint.has(tint)) byTint.set(tint, []);
    byTint.get(tint).push(i);
  }
  disposed.push(geo);
  const m4 = new THREE.Matrix4();
  for (const [tint, idxs] of byTint) {
    const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(tint) });
    const inst = new THREE.InstancedMesh(geo, mat, idxs.length);
    inst.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    idxs.forEach((i, k) => {
      m4.makeTranslation(sc.starPos[i * 3], sc.starPos[i * 3 + 1], sc.starPos[i * 3 + 2]);
      inst.setMatrixAt(k, m4);
    });
    inst.instanceMatrix.needsUpdate = true;
    g.add(inst);
    disposed.push(mat, inst);
  }

  // ①b 光晕：**一次 Points 画完全部**（观感 + 合批两个都要，见下方取舍记录）
  //
  // 🔴 2026-11-25 试过并否决的两版：
  //    v1 放大的半透明**球** → 实体几何，暗背景上成"灰雾团"（近景截图里恒星周围的脏灰）。
  //    v2 每个恒星一个 **Sprite**（径向渐变贴图）→ 观感对了，但**每个 Sprite 是独立对象**，
  //       实测 draw calls：30 系 42 / 120 系 132 / **300 系 312** —— 完全违背 N2 判据（<50）。
  //       这正是"合批省下来的又还回去"，而且随规模线性增长。
  //
  // v3（本版）：一张 `Points` + 自定义 shader。要点：
  //   · `gl_PointSize` 由 shader 按**距相机远近**算，保持世界尺度（不是固定像素）
  //   · 片元里用 `gl_PointCoord` 做径向渐变 —— 与 v2 的贴图同一套数学，但不用贴图
  //   · 颜色来自顶点属性（色温），所以**五类色温仍能一次画完**（不用分 5 批）
  //   · 加色混合，叠在星图上才是"光"
  //   结果：恒星本体 5 批（按色温分 InstancedMesh）+ 光晕 **1 批**。
  const glowGeo = new THREE.BufferGeometry();
  glowGeo.setAttribute('position', new THREE.BufferAttribute(sc.starPos, 3));
  const tintArr = new Float32Array(sc.counts.stars * 3);
  const tmpColor = new THREE.Color();
  for (let i = 0; i < sc.counts.stars; i++) {
    tmpColor.set(starTintOf(sc.ids[i]));
    tintArr[i * 3] = tmpColor.r;
    tintArr[i * 3 + 1] = tmpColor.g;
    tintArr[i * 3 + 2] = tmpColor.b;
  }
  glowGeo.setAttribute('color', new THREE.BufferAttribute(tintArr, 3));

  const glowMat = new THREE.ShaderMaterial({
    uniforms: {
      uPixelRatio: { value: Math.min(1.5, window.devicePixelRatio || 1) },
      uGlowScale: { value: 4.5 },        // 光晕直径 = 恒星球直径 × 这个数
      uWorldRadius: { value: STAR_RADIUS },
    },
    vertexShader: `
      attribute vec3 color;
      varying vec3 vColor;
      varying float vFade;
      uniform float uPixelRatio;
      uniform float uGlowScale;
      uniform float uWorldRadius;
      void main() {
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        // 世界尺寸 → 屏幕像素（透视：越远越小）
        float px = uWorldRadius * uGlowScale * 2.0 * uPixelRatio
                 * (300.0 / max(1.0, -mv.z));
        gl_PointSize = clamp(px, 1.5, 220.0);
        // 远处光晕衰减：太小的时候别硬画成亮点噪
        vFade = clamp(px / 6.0, 0.0, 1.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vFade;
      void main() {
        vec2 d = gl_PointCoord - vec2(0.5);
        float r = length(d) * 2.0;          // 0 中心 → 1 边缘
        if (r > 1.0) discard;
        // 与 v2 贴图同一套衰减：中心亮、中段快降、边缘归零
        float a = 1.0;
        a *= smoothstep(0.0, 0.25, 1.0 - r) * 0.45 + 0.55;   // 核心
        a *= pow(1.0 - r, 2.2);                              // 外围拖尾
        a *= vFade;
        if (a < 0.004) discard;
        // 2026-11-25 调参：第一版 0.85 偏弱，远景几乎看不见光晕；
        // 群星的光晕在暗背景上是**过曝**的（近白）。1.15 让加色叠起来能"顶到白"。
        gl_FragColor = vec4(vColor, a * 1.15);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
  });
  const glowPoints = new THREE.Points(glowGeo, glowMat);
  glowPoints.frustumCulled = false;   // Points 的包围盒按点算，容易被误剔
  g.add(glowPoints);
  disposed.push(glowGeo, glowMat, glowPoints);
  // ⚠️ 已知代价：`gl_PointSize` 的上限由 GPU 决定（常见 64~256px）。
  //    贴很近时大恒星的光晕会被截断成方块 —— clamp 到 220 就是为此。
  //    正式实现若要做"贴近看单颗恒星"，光晕应换成 billboard 几何而不是 Points。

  // ② 航道：一个 LineSegments（一次 draw call 画全部线段）
  //    颜色按 MANIFEST：「只有一种青色（约 #4fd6d6），靠明暗分主次，不按类型换色」
  const lgeo = new THREE.BufferGeometry();
  lgeo.setAttribute('position', new THREE.BufferAttribute(sc.lanePos, 3));
  const lmat = new THREE.LineBasicMaterial({
    color: new THREE.Color(LANE_COLOR), transparent: true, opacity: 0.42,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const lines = new THREE.LineSegments(lgeo, lmat);
  g.add(lines);
  disposed.push(lgeo, lmat, lines);

  // ②b 航道端点小点（MANIFEST：连接点处有小圆点）
  //
  // 🔴 2026-11-25 修：第一版把**所有恒星**的位置当端点小点画了一遍 ——
  //    结果每个恒星都被一个额外的青色点压着，近景看起来"恒星边缘有一圈脏绿"。
  //    群星的"连接处小圆点"指的是**航道起止的那一头**，而航道两端就是恒星本身，
  //    所以正确做法是**不画**这一层：恒星光晕已经充当了那个点。
  //    （只在"航道连到没有恒星的位置"时才需要补点，而这个数据模型里不存在那种情况。）
  //    这里保留段落注释说明为何删除，而不是悄悄删掉。

  // ③ 边界：**平面切片**（用户口径 ②）
  //
  // 为什么不是一条线：只有一条轮廓线时，"这是平面切片还是立体体积"根本看不出来。
  // 群星的做法是**半透明片区**（领土是一片有色的面），轮廓只是它的边。
  // 所以这里画两层：
  //   · 填充面（三角扇，z=0 平面）—— 让人看见"这一片是领土"
  //   · 轮廓线（稍抬高到 z=0.5，压在面上不被 z-fighting 吃掉）
  // 两者都是**平面**（所有顶点 z 相同），这就是"切片"而不是"体积"。
  for (const b of sc.borders) {
    // 三角扇：以第一个点为中心扇形剖分（轮廓是简单多边形，够用）
    const verts = [];
    const n = b.length / 3;
    for (let i = 1; i < n - 1; i++) {
      verts.push(b[0], b[1], b[2]);
      verts.push(b[i * 3], b[i * 3 + 1], b[i * 3 + 2]);
      verts.push(b[(i + 1) * 3], b[(i + 1) * 3 + 1], b[(i + 1) * 3 + 2]);
    }
    const fgeo = new THREE.BufferGeometry();
    fgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
    const fmat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(BORDER_FILL), transparent: true, opacity: 0.20,
      side: THREE.DoubleSide, depthWrite: false,
    });
    const fill = new THREE.Mesh(fgeo, fmat);
    g.add(fill);
    disposed.push(fgeo, fmat, fill);
  }

  // ④ 轮廓线：**厚软带**（观感：MANIFEST 记「厚带双线结构：内 1px 亮线 + 外柔光 8~12px」；
  //    对照 `refs/src/星域视图2.jpg` 量：边界带整体宽 8~12px，中心亮、两侧软）
  //
  // 🔴 关键限制：three 的 `LineBasicMaterial.linewidth` 在 WebGL 里**几乎总是 1**
  //    （硬件不支持宽线）。所以"厚带"不能靠 linewidth，只有两条路：
  //      A. 用三角形带手搓一条有宽度的管（正解，但代码量大）
  //      B. **用 N 条不同粗细/透明度的线叠加**，形成"中心亮→两侧暗"的渐变带
  //    本原型先用 B：因为屏幕像素宽度随相机变化，B 的观感在任意缩放下都稳定，
  //    且仍然是几个常量批次。正式实现若要更精确，换成 A（三角带）。
  //
  // B 的做法：同一轮廓画 5 遍，永不改变线宽（都是 1px），而是靠**逐层偏移 + 逐层变淡**
  // 在屏幕上"堆"出一条带宽。偏移量在世界_unit 里按边界半径缩放，
  // 这样近景是一条厚带、远景自动收成一条细线 —— 与群星的 LOD 观感一致。
  const borderLayers = [
    // [向外偏移(占半径比例), 透明度, 颜色, z 抬高]
    [0.030, 0.08, BORDER_GLOW, 0.10],
    [0.018, 0.16, BORDER_GLOW, 0.20],
    [0.009, 0.30, BORDER_GLOW, 0.30],
    [0.003, 0.55, BORDER_GLOW, 0.40],
    [0.000, 0.95, BORDER_INNER, 0.50],   // 内亮线：最后画、最亮
  ];
  for (const [offsetRatio, op, color, zLift] of borderLayers) {
    const segs = [];
    for (const b of sc.borders) {
      const n = b.length / 3;
      if (n < 3) continue;
      // 计算轮廓质心（用于"向外偏移"的方向）
      let cx = 0, cy = 0;
      for (let i = 0; i < n - 1; i++) { cx += b[i * 3]; cy += b[i * 3 + 1]; }
      cx /= (n - 1); cy /= (n - 1);
      const off = offsetRatio * sc.radius;
      const at = (i) => {
        const x = b[i * 3], y = b[i * 3 + 1];
        if (!off) return [x, y];
        const dx = x - cx, dy = y - cy;
        const d = Math.hypot(dx, dy) || 1;
        return [x + (dx / d) * off, y + (dy / d) * off];
      };
      for (let i = 0; i < n - 1; i++) {
        const [ax, ay] = at(i);
        const [bx2, by2] = at(i + 1);
        segs.push(ax, ay, b[i * 3 + 2] + zLift);
        segs.push(bx2, by2, b[(i + 1) * 3 + 2] + zLift);
      }
    }
    if (!segs.length) continue;
    const geo4 = new THREE.BufferGeometry();
    geo4.setAttribute('position', new THREE.BufferAttribute(new Float32Array(segs), 3));
    const mat4 = new THREE.LineBasicMaterial({
      color: new THREE.Color(color), transparent: true, opacity: op,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const ln = new THREE.LineSegments(geo4, mat4);
    g.add(ln);
    disposed.push(geo4, mat4, ln);
  }

  return g;
}

// ── 逐对象版（对照组）：N 批 ────────────────────────────────────────────
function buildNaive(sc) {
  const g = new THREE.Group();
  const geo = makeStarGeometry();
  const mat = new THREE.MeshLambertMaterial({ color: 0xffe9b8, emissive: 0x9a7b3a });
  disposed.push(geo, mat);

  for (let i = 0; i < sc.counts.stars; i++) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(sc.starPos[i * 3], sc.starPos[i * 3 + 1], sc.starPos[i * 3 + 2]);
    g.add(m);
  }

  const lmat = new THREE.LineBasicMaterial({ color: 0x64c8e8, transparent: true, opacity: 0.55 });
  disposed.push(lmat);
  for (let i = 0; i < sc.counts.laneSegments; i++) {
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(sc.lanePos.slice(i * 6, i * 6 + 6), 3));
    const ln = new THREE.Line(lg, lmat);
    g.add(ln);
    disposed.push(lg, ln);
  }

  const bmat = new THREE.LineBasicMaterial({ color: 0xffd479, transparent: true, opacity: 0.85 });
  disposed.push(bmat);
  for (const b of sc.borders) {
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.BufferAttribute(b, 3));
    const bl = new THREE.Line(bg, bmat);
    g.add(bl);
    disposed.push(bg, bl);
  }
  return g;
}

// ═══════════════════════════════════════════════════════════════════════════
// 4. 帧率测量
// ═══════════════════════════════════════════════════════════════════════════
const frameSamples = [];
let measuring = false, measureUntil = 0, measureLabel = '';

function pushFrame(dt) {
  if (!measuring) return;
  frameSamples.push(dt);
  if (performance.now() >= measureUntil) {
    measuring = false;
    finishMeasure();
  }
}

function stats(arr) {
  const a = arr.slice().sort((x, y) => x - y);
  const pick = (q) => a[Math.min(a.length - 1, Math.max(0, Math.floor(a.length * q)))];
  const sum = a.reduce((s, v) => s + v, 0);
  return { n: a.length, median: pick(0.5), p95: pick(0.95), max: a[a.length - 1], avg: sum / Math.max(1, a.length) };
}

// ═══════════════════════════════════════════════════════════════════════════
// 4b. **帧时口径修正（2026-11-25 第一跑踩到的坑）**
//
// 第一跑量出"合批 16.70ms / 逐对象 16.70ms"—— 两边一模一样，而且正好是 60fps 的 16.67ms。
// 那不是"两版一样快"，是 **rAF 被 vsync 拍平了**：`renderer.render()` 若只花 3ms，
// 浏览器照样等到下一个刷新点才回调 → 量到的是刷新周期，不是渲染耗时。
// 在这种口径下"合批加速 1.0×"是**假的**，继续调会得出"合批没用"的错误结论。
//
// 正确口径：用 `performance.now()` 夹住 `renderer.render()` 本身，
// 量**同步渲染耗时**（draw call 提交 + GPU 命令编码），这才是合批真正改善的量。
// 同时保留原帧时（vsync 口径），两个数一起报 —— 帧时告诉我们"卡不卡"，
// 渲染耗时告诉我们"有没有余量"。
// ═══════════════════════════════════════════════════════════════════════════
const renderSamples = [];

const RESULT = {};
// 挂到 window：外部探针（probe_domain3d.py）要读它。模块作用域里的 const 外部看不见。
window.RESULT = RESULT;

function beginMeasure(label) {
  frameSamples.length = 0;
  renderSamples.length = 0;
  measuredCalls = 0;
  measureLabel = label;
  measuring = true;
  measureUntil = performance.now() + 5000;
  log(`开始量：${label}（5 秒）`, 'hi');
  $('btn-run').disabled = true;
}

let measuredCalls = 0;

function finishMeasure() {
  // 两个口径一起报：
  //   · frames  = rAF 帧时（vsync 拍平，只反映"卡不卡"）
  //   · render  = renderer.render() 同步耗时（合批真正改善的量）
  const f = stats(frameSamples);
  const r = stats(renderSamples);
  RESULT[mode] = {
    ...f,
    calls: measuredCalls,
    renderMedian: r.median,
    renderP95: r.p95,
    renderMax: r.max,
    renderAvg: r.avg,
    renderN: r.n,
  };
  log(`${measureLabel}：${f.n} 帧 · 帧时中位 ${f.median.toFixed(2)}ms · `
    + `**渲染中位 ${r.median.toFixed(3)}ms** · p95 ${r.p95.toFixed(3)}ms · calls ${measuredCalls}`, 'ok');
}

async function runAll() {
  $('verdict').className = 'verdict';
  // 先量合批
  switchMode('batched');
  await new Promise((r) => setTimeout(r, 800));   // 让上一帧的抖动过去
  beginMeasure('合批版');
  await sleep(5400);
  // 再量逐对象
  switchMode('naive');
  await new Promise((r) => setTimeout(r, 800));
  beginMeasure('逐对象版（对照）');
  await sleep(5400);

  $('btn-run').disabled = false;
  showVerdict();
}

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function showVerdict() {
  const b = RESULT.batched, n = RESULT.naive;
  if (!b || !n) return;
  const fpsB = 1000 / b.median, fpsN = 1000 / n.median;
  const pass = fpsB >= 30;
  const v = $('verdict');
  v.className = 'verdict show ' + (pass ? 'pass' : 'fail');
  v.innerHTML =
    `<b>结论：${pass ? 'B 方案可行' : 'B 方案有风险'}</b><br>` +
    `合批版 中位帧时 <b>${b.median.toFixed(2)}ms</b>（${fpsB.toFixed(1)}fps），` +
    `逐对象 <b>${n.median.toFixed(2)}ms</b>（${fpsN.toFixed(1)}fps）<br>` +
    `合批快 <b>${(n.median / Math.max(0.001, b.median)).toFixed(1)}×</b>；` +
    `draw calls <b>${b.calls}</b> vs <b>${n.calls}</b><br>` +
    `<span style="opacity:.75">判据：合批版中位 ≤ 33ms（30fps）。` +
    `${pass ? '剩余预算可用于交互与观感。' : '需要先减实例数或换渲染方式，别急着做正式实现。'}</span>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// 5. 模式切换
// ═══════════════════════════════════════════════════════════════════════════
let SCENE_DATA = null;
// 挂到 window 供外部探针读取（模块作用域的 let 外部看不见）

// ── 相机记忆（用户口径 ①：从 3D 域内点进单系后，**返回时保持原相机**）──────
//
// 这条口径的产品含义：用户拉到一个"想看的角落"、点进某个恒星系看细节、
// 退回来时**必须还在那个角落**。否则每次下钻都把人弹回全景，等于每次都要重新找位置。
//
// 实现要点（不只是"存一份坐标"）：
//   · 存相机位置 **和** OrbitControls 的 target —— 只存位置会绕着原点转，
//     用户当时看的是某个偏心区域，只恢复位置会让画面指向别处。
//   · 存的时候要 `controls.update()` 之后读，否则读到的还是上一帧的懒更新值。
//   · 恢复用 `controls.saveState()/reset()` 的语义等价物手写，便于序列化
//     （正式实现里这份状态要跨组件生命周期，甚至写进项目文件）。
const cameraMemory = {
  position: null,   // {x,y,z}
  target: null,     // {x,y,z}
  saved: false,
};

function saveCamera() {
  controls.update();   // 先让 controls 把自己的懒状态推完，再读
  cameraMemory.position = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
  cameraMemory.target = { x: controls.target.x, y: controls.target.y, z: controls.target.z };
  cameraMemory.saved = true;
  log(`已记住相机：位置 (${camera.position.x.toFixed(0)}, ${camera.position.y.toFixed(0)}, `
    + `${camera.position.z.toFixed(0)})，看向 (${controls.target.x.toFixed(0)}, `
    + `${controls.target.y.toFixed(0)}, ${controls.target.z.toFixed(0)})`, 'hi');
}

function restoreCamera() {
  if (!cameraMemory.saved) { log('还没有记住的相机位置', 'err'); return false; }
  const p = cameraMemory.position, t = cameraMemory.target;
  camera.position.set(p.x, p.y, p.z);
  controls.target.set(t.x, t.y, t.z);
  controls.update();
  renderer.render(scene, camera);
  log('已恢复到记住的相机（与离开时逐位一致）', 'ok');
  return true;
}

/** 把当前相机与记忆做比对（给视觉反馈用：证明"回来了"而不是"看起来差不多"） */
function cameraDelta() {
  if (!cameraMemory.saved) return null;
  const p = cameraMemory.position, t = cameraMemory.target;
  return {
    pos: Math.hypot(camera.position.x - p.x, camera.position.y - p.y, camera.position.z - p.z),
    target: Math.hypot(controls.target.x - t.x, controls.target.y - t.y, controls.target.z - t.z),
  };
}

function switchMode(next) {
  mode = next;
  if (batchedGroup) scene.remove(batchedGroup);
  if (naiveGroup) scene.remove(naiveGroup);
  if (next === 'batched') {
    batchedGroup = buildBatched(SCENE_DATA);
    scene.add(batchedGroup);
  } else {
    naiveGroup = buildNaive(SCENE_DATA);
    scene.add(naiveGroup);
  }
  // 强制立即渲染一帧，让 renderer.info 记账（three 的 info 只在渲染时更新）
  renderer.render(scene, camera);
  measuredCalls = renderer.info.render.calls;
  updateHud();
}

function updateHud() {
  const c = SCENE_DATA.counts;
  $('v-stars').textContent = c.stars;
  $('v-lanes').textContent = c.laneSegments;
  $('v-borders').textContent = c.borders;
  $('v-mode').textContent = mode === 'batched' ? '合批版（3 批）' : '逐对象版（对照组）';
  $('v-calls').textContent = renderer ? renderer.info.render.calls : '–';
}

// ═══════════════════════════════════════════════════════════════════════════
// 6. 启动
// ═══════════════════════════════════════════════════════════════════════════
async function boot() {
  try {
    THREE = await import('three');
    const oc = await import('three/examples/jsm/controls/OrbitControls.js');
    OrbitControls = oc.OrbitControls;
  } catch (err) {
    log('three 加载失败（离线？）：' + err.message, 'err');
    $('btn-run').disabled = true;
    return;
  }

  const canvas = $('c');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);   // 与 System3DView 同口径：像素比封顶，别被 4K 屏的 DPR 骗了
  renderer.setSize(window.innerWidth, window.innerHeight, false);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07090f);
  scene.fog = new THREE.FogExp2(0x07090f, 0.00016);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 30000);
  camera.position.set(0, -1500, 1200);
  camera.lookAt(0, 0, 0);

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = true;
  controls.minDistance = 300;
  controls.maxDistance = 9000;

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(600, -900, 1400);
  scene.add(key);

  // 规模可由 URL 参数给（探针用 ?stars=N 压测），默认 30（A 档 120 星 ÷ 4 势力）
  const qs = new URLSearchParams(location.search);
  const starCount = Math.max(1, Math.min(500, Number(qs.get('stars')) || 30));
  const fx = makeDomainFixture({ stars: starCount });
  SCENE_DATA = buildScene(fx);
  window.SCENE_DATA = SCENE_DATA;   // 探针要读 counts
  window.RESULT = RESULT;
  // 切换模式与测量入口也挂出去：探针不该模拟点按钮（按钮文案会改，DOM 会变）
  window.__proto = {
    switchMode: (m) => switchMode(m),
    runAll: () => runAll(),
    result: () => RESULT,
    info: () => ({ calls: renderer.info.render.calls, mode }),
    // 相机记忆（用户口径 ①）：截图器要能程序化调用，不该去点按钮
    saveCamera: () => { saveCamera(); return cameraMemory; },
    restoreCamera: () => restoreCamera(),
    cameraDelta: () => cameraDelta(),
    cameraMemory: () => cameraMemory,
    // 🔴 2026-11-25：`camera` / `controls` / `renderer` / `scene` 都是**模块作用域**的变量，
    //    外部 cdp.eval 里写 `camera.position.set(...)` 会 ReferenceError（"camera is not defined"）。
    //    第一版截图器因此**全程静默失败**，六张图是同一张 —— 而"相机记忆逐像素相同"照绿。
    //    所以这里把相机操作收成一个函数，外部只调函数，不碰变量。
    setCamera: (px, py, pz, tx, ty, tz) => {
      // 关阻尼：否则 controls.update() 会用内部阻尼状态把相机拉回旧位置
      controls.enableDamping = false;
      camera.position.set(px, py, pz);
      controls.target.set(tx, ty, tz);
      controls.update();
      renderer.render(scene, camera);
      return {
        p: [camera.position.x, camera.position.y, camera.position.z],
        t: [controls.target.x, controls.target.y, controls.target.z],
        dist: camera.position.distanceTo(controls.target),
      };
    },
    // 给截图器一个"自己重绘一帧"的口子（three 的懒更新会让第一帧还是旧相机）
    tick: () => {
      controls.update();
      renderer.render(scene, camera);
      return { calls: renderer.info.render.calls };
    },
  };
  log(`数据：${SCENE_DATA.counts.stars} 恒星系 / ${SCENE_DATA.counts.laneSegments} 航道段 / ` +
      `${SCENE_DATA.counts.borders} 条边界`, 'hi');
  log(`无合批时会是 ${SCENE_DATA.counts.drawCallsIfNaive} 个 draw call`, 'hi');

  switchMode('batched');

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  });

  $('btn-run').addEventListener('click', runAll);
  $('btn-batched').addEventListener('click', () => switchMode('batched'));
  $('btn-naive').addEventListener('click', () => switchMode('naive'));

  // HUD 折叠（截图时要收起，否则面板挡住星图 —— 第一版就是这么拍坏的）
  const hud = $('hud');
  $('btn-hud').addEventListener('click', () => {
    hud.classList.toggle('collapsed');
    $('btn-hud').textContent = hud.classList.contains('collapsed') ? '+' : '−';
  });
  // 探针/截图器用它收起面板
  window.__hudSetCollapsed = (v) => {
    hud.classList.toggle('collapsed', !!v);
    $('btn-hud').textContent = v ? '+' : '−';
  };
  // 相机记忆演示（用户口径 ①）：走开 → 回来
  $('btn-cam-drift').addEventListener('click', () => {
    // 先记，再故意把相机拉走（模拟"点进单系看细节"之后回来的场景）
    saveCamera();
    camera.position.set(1200, -2600, 1900);
    controls.target.set(200, -150, 0);
    controls.update();
    renderer.render(scene, camera);
    log('相机已故意拉走 —— 现在点"回到离开时的位置"', 'hi');
  });
  $('btn-cam-back').addEventListener('click', () => {
    restoreCamera();
    const d = cameraDelta();
    if (d) {
      log(`校验：位置偏差 ${d.pos.toFixed(4)} / 朝向偏差 ${d.target.toFixed(4)}（应都是 0）`,
        d.pos < 1e-6 && d.target < 1e-6 ? 'ok' : 'err');
    }
  });

  // 主循环
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = now - last;
    last = now;
    controls.update();
    // 夹住 render()：这是合批真正改善的量（见上方 4b 的口径说明）
    const t0 = performance.now();
    renderer.render(scene, camera);
    const t1 = performance.now();
    if (measuring) {
      renderSamples.push(t1 - t0);
      measuredCalls = Math.max(measuredCalls, renderer.info.render.calls);
    }
    pushFrame(dt);
    if (Math.random() < 0.08) {   // 这个 Math.random 只影响 HUD 刷新频率，不影响数据
      $('v-fps').textContent = (1000 / Math.max(0.001, dt)).toFixed(0) + ' fps';
      $('v-frame').textContent = dt.toFixed(1) + ' ms';
      $('v-calls').textContent = renderer.info.render.calls;
    }
  }
  requestAnimationFrame(loop);
  log('就绪 —— 点"开始量"跑两轮对照', 'ok');
}

boot();
</script>
</body>
</html>
