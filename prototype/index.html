<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>司天 · 地形笔刷原型</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --btn: #21262d;
      --btn-hover: #30363d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .topbar h1 { font-size: 14px; font-weight: 600; color: var(--accent); }
    .topbar .sep { width: 1px; height: 20px; background: var(--border); }
    .topbar button {
      padding: 4px 10px; font-size: 12px; background: var(--btn);
      border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer;
    }
    .topbar button:hover { background: var(--btn-hover); }
    .topbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .topbar .coords { font-size: 11px; color: var(--muted); margin-left: auto; font-family: monospace; }
    .topbar .fps { font-size: 11px; color: var(--muted); font-family: monospace; min-width: 50px; text-align: right; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .left-panel {
      width: 220px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    }
    .panel-section { padding: 12px; border-bottom: 1px solid var(--border); }
    .panel-section h3 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .palette-item {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px;
      border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent;
    }
    .palette-item:hover { background: var(--btn); }
    .palette-item.active { border-color: var(--accent); background: rgba(88,166,255,0.1); }
    .palette-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .slider-row label { font-size: 11px; color: var(--muted); width: 50px; flex-shrink: 0; }
    .slider-row input[type=range] { flex: 1; height: 4px; }
    .slider-row .val { font-size: 11px; font-family: monospace; width: 28px; text-align: right; }
    .layer-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }
    .layer-item:hover { background: var(--btn); }
    .layer-item .vis-toggle { font-size: 14px; width: 18px; text-align: center; opacity: 0.5; }
    .layer-item .vis-toggle.on { opacity: 1; }
    .canvas-container { flex: 1; position: relative; overflow: hidden; background: #1a2a3a; }
    #mainCanvas {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); cursor: crosshair;
      image-rendering: pixelated; box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    #brushPreview {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    .perf-stats {
      position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      padding: 8px 12px; border-radius: 6px; font-size: 11px; font-family: monospace; color: var(--muted);
    }
    .hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 20px;
      font-size: 11px; color: var(--muted); white-space: nowrap;
    }
    #error-banner {
      display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: #f85149; color: white; padding: 8px 16px; border-radius: 6px;
      font-size: 12px; z-index: 100; max-width: 80%;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>司天 · 地形笔刷原型</h1>
    <div class="sep"></div>
    <button id="undoBtn" disabled>↩ 撤销</button>
    <button id="redoBtn" disabled>↪ 重做</button>
    <div class="sep"></div>
    <button id="clearBtn">清空</button>
    <button id="randomBtn">随机生成</button>
    <div class="sep"></div>
    <span class="coords" id="coords">X: 0, Y: 0</span>
    <span class="fps" id="fps">-- FPS</span>
  </div>
  
  <div class="main">
    <div class="left-panel">
      <div class="panel-section">
        <h3>地形类型</h3>
        <div class="palette" id="palette"></div>
      </div>
      <div class="panel-section">
        <h3>笔刷参数</h3>
        <div class="slider-row">
          <label>大小</label>
          <input type="range" id="brushSize" min="5" max="80" value="25">
          <span class="val" id="brushSizeVal">25</span>
        </div>
        <div class="slider-row">
          <label>硬度</label>
          <input type="range" id="brushHardness" min="0" max="100" value="60">
          <span class="val" id="brushHardnessVal">0.6</span>
        </div>
      </div>
      <div class="panel-section">
        <h3>画布</h3>
        <div class="slider-row">
          <label>格子数</label>
          <input type="range" id="gridSize" min="64" max="384" step="64" value="192">
          <span class="val" id="gridSizeVal">192</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;" id="gridInfo">192×192 = 36,864 格</div>
      </div>
      <div class="panel-section">
        <h3>图层</h3>
        <div id="layerList"></div>
      </div>
    </div>
    
    <div class="canvas-container">
      <canvas id="mainCanvas"></canvas>
      <canvas id="brushPreview"></canvas>
      <div class="perf-stats" id="perfStats">初始化中...</div>
      <div class="hint">按住鼠标拖动绘制 · 滚轮缩放 · Ctrl+Z 撤销</div>
      <div id="error-banner"></div>
    </div>
  </div>
  
  <script src="brush.js"></script>
  <script>
    // 全局错误捕获
    window.onerror = function(msg, url, line, col, err) {
      var banner = document.getElementById('error-banner');
      banner.style.display = 'block';
      banner.textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
      console.error('Global error:', msg, url, line, col, err);
      return false;
    };
    
    // ===== MapCanvasApp 类定义 =====
    class MapCanvasApp {
      constructor() {
        this.mainCanvas = document.getElementById('mainCanvas');
        this.previewCanvas = document.getElementById('brushPreview');
        this.mainCtx = this.mainCanvas.getContext('2d');
        this.previewCtx = this.previewCanvas.getContext('2d');
        
        this.displaySize = 768;
        this.gridWidth = 192;
        this.gridHeight = 192;
        this.cellSize = this.displaySize / this.gridWidth;
        
        this.mainCanvas.width = this.displaySize;
        this.mainCanvas.height = this.displaySize;
        this.previewCanvas.width = this.displaySize;
        this.previewCanvas.height = this.displaySize;
        
        this.grid = new Uint8Array(this.gridWidth * this.gridHeight);
        this.grid.fill(0);
        
        this.brush = new TerrainBrush();
        this.renderer = new TerrainRenderer(this.mainCanvas, this.gridWidth, this.gridHeight);
        this.undoManager = new UndoManager();
        this.layerManager = new LayerManager();
        
        this.isDrawing = false;
        this.lastX = 0;
        this.lastY = 0;
        this.scale = 1;
        
        this.frameTimes = [];
        this.lastFrameTime = performance.now();
        
        this.initPalette();
        this.initLayers();
        this.initEvents();
        this.initSliders();
        this.renderAll();
        this.startFPSCounter();
        
        document.getElementById('perfStats').textContent = '就绪';
      }
      
      initPalette() {
        var self = this;
        var palette = document.getElementById('palette');
        var terrains = [
          { name: '海洋', rgb: '41,98,168' },
          { name: '沙滩', rgb: '210,190,140' },
          { name: '草地', rgb: '86,150,70' },
          { name: '森林', rgb: '34,100,34' },
          { name: '沙漠', rgb: '210,180,120' },
          { name: '山脉', rgb: '130,110,90' },
          { name: '雪地', rgb: '230,235,240' },
          { name: '岩石', rgb: '100,100,100' }
        ];
        terrains.forEach(function(t, i) {
          var item = document.createElement('div');
          item.className = 'palette-item' + (i === 2 ? ' active' : '');
          item.innerHTML = '<div class="palette-swatch" style="background:rgb(' + t.rgb + ')"></div>' + t.name;
          item.onclick = function() {
            var items = document.querySelectorAll('.palette-item');
            for (var j = 0; j < items.length; j++) items[j].classList.remove('active');
            item.classList.add('active');
            self.brush.terrainType = i;
          };
          palette.appendChild(item);
        });
      }
      
      initLayers() {
        var self = this;
        var list = document.getElementById('layerList');
        var layers = [
          { id: 'terrain', name: '基础地形' },
          { id: 'features', name: '特征覆盖' },
          { id: 'labels', name: '标签' },
          { id: 'grid', name: '网格' }
        ];
        layers.forEach(function(layer) {
          var item = document.createElement('div');
          item.className = 'layer-item';
          item.innerHTML = '<span class="vis-toggle on">●</span><span>' + layer.name + '</span>';
          item.querySelector('.vis-toggle').onclick = function(e) {
            e.stopPropagation();
            item.querySelector('.vis-toggle').classList.toggle('on');
          };
          list.appendChild(item);
        });
      }
      
      initSliders() {
        var self = this;
        var sizeSlider = document.getElementById('brushSize');
        var hardnessSlider = document.getElementById('brushHardness');
        var gridSlider = document.getElementById('gridSize');
        
        sizeSlider.oninput = function() {
          self.brush.size = parseInt(sizeSlider.value);
          document.getElementById('brushSizeVal').textContent = sizeSlider.value;
        };
        hardnessSlider.oninput = function() {
          self.brush.hardness = parseInt(hardnessSlider.value) / 100;
          document.getElementById('brushHardnessVal').textContent = self.brush.hardness.toFixed(1);
        };
        gridSlider.onchange = function() {
          self.resizeGrid(parseInt(gridSlider.value));
        };
        
        document.getElementById('clearBtn').onclick = function() { self.clearCanvas(); };
        document.getElementById('randomBtn').onclick = function() { self.generateRandom(); };
        document.getElementById('undoBtn').onclick = function() { self.undo(); };
        document.getElementById('redoBtn').onclick = function() { self.redo(); };
      }
      
      resizeGrid(newSize) {
        document.getElementById('gridSizeVal').textContent = newSize;
        document.getElementById('gridInfo').textContent = newSize + '×' + newSize + ' = ' + (newSize*newSize).toLocaleString() + ' 格';
        this.gridWidth = newSize;
        this.gridHeight = newSize;
        this.cellSize = this.displaySize / newSize;
        this.grid = new Uint8Array(newSize * newSize);
        this.grid.fill(0);
        this.renderer.gridWidth = newSize;
        this.renderer.gridHeight = newSize;
        this.renderer.cellSize = this.cellSize;
        this.undoManager.clear();
        this.renderAll();
      }
      
      initEvents() {
        var self = this;
        var canvas = this.mainCanvas;
        
        canvas.addEventListener('mousedown', function(e) {
          if (e.button === 0) {
            self.startStroke(e.offsetX, e.offsetY);
            e.preventDefault();
          }
        });
        
        canvas.addEventListener('mousemove', function(e) {
          self.onMouseMove(e.offsetX, e.offsetY);
          document.getElementById('coords').textContent = 'X: ' + e.offsetX + ', Y: ' + e.offsetY;
        });
        
        canvas.addEventListener('mouseup', function(e) {
          if (e.button === 0) self.endStroke();
        });
        
        canvas.addEventListener('mouseleave', function() {
          self.clearBrushPreview();
        });
        
        canvas.addEventListener('wheel', function(e) {
          e.preventDefault();
          var delta = e.deltaY > 0 ? 0.9 : 1.1;
          self.scale = Math.max(0.5, Math.min(3, self.scale * delta));
          canvas.style.transform = 'translate(-50%,-50%) scale(' + self.scale + ')';
          self.previewCanvas.style.transform = 'translate(-50%,-50%) scale(' + self.scale + ')';
        }, { passive: false });
        
        document.addEventListener('keydown', function(e) {
          if (e.ctrlKey && e.key === 'z') { e.preventDefault(); self.undo(); }
          else if (e.ctrlKey && e.key === 'y') { e.preventDefault(); self.redo(); }
        });
      }
      
      startStroke(x, y) {
        this.isDrawing = true;
        this.lastX = x;
        this.lastY = y;
        this.undoManager.beginStroke(this.grid, this.gridWidth, this.gridHeight);
        var bounds = this.brush.paint(this.grid, this.gridWidth, this.gridHeight, x, y, this.cellSize);
        this.renderer.renderRegion(this.grid, bounds);
      }
      
      onMouseMove(x, y) {
        this.drawBrushPreview(x, y);
        if (!this.isDrawing) return;
        var bounds = this.brush.paintInterpolated(
          this.grid, this.gridWidth, this.gridHeight,
          this.lastX, this.lastY, x, y, this.cellSize
        );
        if (bounds) this.renderer.renderRegion(this.grid, bounds);
        this.lastX = x;
        this.lastY = y;
      }
      
      endStroke() {
        if (!this.isDrawing) return;
        this.isDrawing = false;
        this.undoManager.endStroke();
        document.getElementById('undoBtn').disabled = !this.undoManager.canUndo;
        document.getElementById('redoBtn').disabled = !this.undoManager.canRedo;
      }
      
      drawBrushPreview(x, y) {
        var ctx = this.previewCtx;
        ctx.clearRect(0, 0, this.displaySize, this.displaySize);
        var radius = this.brush.size / 2;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (this.brush.hardness > 0.1) {
          ctx.beginPath();
          ctx.arc(x, y, radius * this.brush.hardness, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fill();
      }
      
      clearBrushPreview() {
        this.previewCtx.clearRect(0, 0, this.displaySize, this.displaySize);
      }
      
      renderAll() { this.renderer.render(this.grid); }
      
      undo() {
        var state = this.undoManager.undo();
        if (state) { this.grid.set(state.snapshot); this.renderAll(); this.updateBtns(); }
      }
      
      redo() {
        var state = this.undoManager.redo();
        if (state) { this.grid.set(state.snapshot); this.renderAll(); this.updateBtns(); }
      }
      
      updateBtns() {
        document.getElementById('undoBtn').disabled = !this.undoManager.canUndo;
        document.getElementById('redoBtn').disabled = !this.undoManager.canRedo;
      }
      
      clearCanvas() {
        this.grid.fill(0);
        this.undoManager.clear();
        this.renderAll();
        this.updateBtns();
      }
      
      generateRandom() {
        for (var i = 0; i < this.grid.length; i++) {
          var x = i % this.gridWidth;
          var y = Math.floor(i / this.gridWidth);
          var nx = x / this.gridWidth, ny = y / this.gridHeight;
          var h = Math.sin(nx*6.28)*0.3 + Math.cos(ny*6.28)*0.3 + Math.sin((nx+ny)*12.56)*0.2 + Math.cos((nx-ny)*9.42)*0.2;
          var cx = nx-0.5, cy = ny-0.5;
          var dist = Math.sqrt(cx*cx+cy*cy)*2;
          var height = h + (1-dist)*0.5;
          var terrain;
          if (height < 0.15) terrain = 0;
          else if (height < 0.25) terrain = 1;
          else if (height < 0.6) terrain = 2;
          else if (height < 0.8) terrain = 3;
          else terrain = 5;
          this.grid[i] = terrain;
        }
        this.renderAll();
      }
      
      startFPSCounter() {
        var self = this;
        var frameCount = 0, lastTime = performance.now();
        function tick() {
          var now = performance.now();
          self.frameTimes.push(now - self.lastFrameTime);
          self.lastFrameTime = now;
          if (self.frameTimes.length > 60) self.frameTimes.shift();
          frameCount++;
          if (now - lastTime >= 1000) {
            var sum = 0;
            for (var i = 0; i < self.frameTimes.length; i++) sum += self.frameTimes[i];
            var avg = sum / self.frameTimes.length;
            var fps = Math.round(1000/avg);
            var el = document.getElementById('fps');
            el.textContent = fps + ' FPS';
            el.style.color = fps >= 50 ? '#3fb950' : fps >= 30 ? '#d29922' : '#f85149';
            document.getElementById('perfStats').textContent = self.gridWidth+'×'+self.gridHeight+' = '+(self.gridWidth*self.gridHeight).toLocaleString()+' 格';
            frameCount = 0;
            lastTime = now;
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
    }
    
    // ===== 类定义结束后再实例化 =====
    try {
      var app = new MapCanvasApp();
      window.app = app;
    } catch(e) {
      var banner = document.getElementById('error-banner');
      banner.style.display = 'block';
      banner.textContent = 'Init Error: ' + e.message;
      console.error('Init failed:', e);
    }
  </script>
</body>
</html>
