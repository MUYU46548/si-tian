<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiTian — 世界观动态构建系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #0a0e18; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; }

    /* ===== 启动 splash（批次A10 / A11 升级）：同款矢量 LOGO + 版本号 + 品牌色 ===== */
    #sitian-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 38%, #16233f 0%, #0a0e18 72%);
      color: #e2e8f0;
      transition: opacity 0.4s ease;
    }
    #sitian-splash.splash-out { opacity: 0; pointer-events: none; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 300px; }
    .splash-logo { width: 96px; height: 96px; filter: drop-shadow(0 0 16px rgba(232, 198, 106, 0.25)); }
    .splash-title { font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #f0f6fc; }
    .splash-title span { font-size: 15px; font-weight: 400; letter-spacing: 2px; color: #8b949e; margin-left: 6px; }
    .splash-sub { font-size: 12px; color: #8b949e; letter-spacing: 3px; }
    .splash-version {
      font-size: 11px; color: #58a6ff; background: rgba(88, 166, 255, 0.12);
      padding: 2px 10px; border-radius: 10px; letter-spacing: 1px;
    }
    .splash-bar { width: 100%; height: 3px; border-radius: 2px; background: #21262d; overflow: hidden; margin-top: 8px; }
    .splash-bar-fill { height: 100%; width: 8%; border-radius: 2px; background: linear-gradient(90deg, #58a6ff, #e8c66a); transition: width 0.3s ease; }
    .splash-status { font-size: 12px; color: #c9d1d9; }
    .splash-tip { font-size: 11px; color: #6e7d92; margin-top: 18px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="sitian-splash">
    <div class="splash-inner">
      <!-- 同款矢量 LOGO（与 exe 图标 icon.svg 同源：天文网格 + 四角星 + 中心金核） -->
      <svg class="splash-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="SiTian">
        <defs>
          <radialGradient id="splash-core" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#fffbe6"/>
            <stop offset="50%" stop-color="#e8c66a"/>
            <stop offset="100%" stop-color="#b8860b"/>
          </radialGradient>
          <radialGradient id="splash-glow" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#e8c66a" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#e8c66a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g stroke="rgba(88,166,255,0.85)" stroke-width="8" stroke-linecap="round">
          <line x1="28" y1="28" x2="484" y2="28"/>
          <line x1="28" y1="256" x2="484" y2="256"/>
          <line x1="28" y1="484" x2="484" y2="484"/>
          <line x1="28" y1="28" x2="28" y2="484"/>
          <line x1="256" y1="28" x2="256" y2="484"/>
          <line x1="484" y1="28" x2="484" y2="484"/>
        </g>
        <g stroke="rgba(155,89,182,0.55)" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round">
          <line x1="28" y1="28" x2="484" y2="484"/>
          <line x1="484" y1="28" x2="28" y2="484"/>
        </g>
        <g fill="#2a3a52">
          <circle cx="28" cy="28" r="28"/>
          <circle cx="484" cy="28" r="28"/>
          <circle cx="484" cy="484" r="28"/>
          <circle cx="28" cy="484" r="28"/>
        </g>
        <g fill="rgba(42,58,82,0.95)">
          <circle cx="256" cy="28" r="18"/>
          <circle cx="484" cy="256" r="18"/>
          <circle cx="256" cy="484" r="18"/>
          <circle cx="28" cy="256" r="18"/>
        </g>
        <circle cx="256" cy="256" r="58" fill="url(#splash-glow)"/>
        <circle cx="256" cy="256" r="28" fill="url(#splash-core)"/>
        <circle cx="250" cy="250" r="10" fill="rgba(255,255,255,0.85)"/>
      </svg>
      <div class="splash-title">司天<span>SiTian</span></div>
      <div class="splash-sub">世界观动态构建系统</div>
      <div class="splash-version" id="splash-version"></div>
      <div class="splash-bar"><div class="splash-bar-fill" id="splash-bar-fill"></div></div>
      <div class="splash-status" id="splash-status">正在启动…</div>
      <div class="splash-tip" id="splash-tip"></div>
    </div>
  </div>
  <script>
    // 启动 splash（批次A10 / A11）：入口脚本与 App 启动链分阶段上报进度，就绪后淡出并移除。
    // tip 按天轮换（确定性，不用随机数）。
    (function () {
      var SPLASH_TIPS = [
        '双击左侧导航树节点，可直接下钻到对应视图',
        '按住空格键可临时切换为拖手平移画布',
        'Ctrl+F 搜索任意节点，回车直达并自动聚焦',
        '行星地图编辑模式中，笔刷工具可快速涂抹地形',
        '按 L 打开图层面板，可按视图开关 / 锁定图层',
        '视口书签可保存并一键回到任意镜头位置',
        '坐标只存于 JSON 缓存层，永远不会写入 Markdown',
        '编辑类操作几乎都可撤销：Ctrl+Z / Ctrl+Y',
      ];
      var tipEl = document.getElementById('splash-tip');
      if (tipEl) tipEl.textContent = '💡 ' + SPLASH_TIPS[Math.floor(Date.now() / 86400000) % SPLASH_TIPS.length];
      var verEl = document.getElementById('splash-version');
      if (verEl) verEl.textContent = 'v' + (window.sitianAPI?.version || '0.1.2');
      var root = document.getElementById('sitian-splash');
      var fill = document.getElementById('splash-bar-fill');
      var status = document.getElementById('splash-status');
      window.__sitianSplash = {
        set: function (p, text) {
          if (fill) fill.style.width = Math.min(100, Math.max(0, p)) + '%';
          if (text && status) status.textContent = text;
        },
        close: function () {
          if (!root) return;
          root.classList.add('splash-out');
          setTimeout(function () { if (root.parentNode) root.parentNode.removeChild(root); }, 450);
        },
      };
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
