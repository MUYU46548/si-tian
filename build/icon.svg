<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#e8c66a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8c66a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="50%" stop-color="#e8c66a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
  </defs>
  <!-- Transparent background (no fill) -->
  
  <!-- Grid: full bleed (0 to 512) -->
  <line x1="0" y1="0" x2="512" y2="0" stroke="#1a2a40" stroke-width="22" stroke-linecap="round"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#1a2a40" stroke-width="22" stroke-linecap="round"/>
  <line x1="0" y1="512" x2="512" y2="512" stroke="#1a2a40" stroke-width="22" stroke-linecap="round"/>
  <line x1="0" y1="0" x2="0" y2="512" stroke="#1a2a40" stroke-width="22" stroke-linecap="round"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#1a2a40" stroke-width="22" stroke-linecap="round"/>
  <line x1="512" y1="0" x2="512" y2="512" stroke="#1a2a40" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Diagonals -->
  <line x1="0" y1="0" x2="512" y2="512" stroke="#5a3a8a" stroke-width="10" stroke-dasharray="14 12" stroke-linecap="round"/>
  <line x1="512" y1="0" x2="0" y2="512" stroke="#5a3a8a" stroke-width="10" stroke-dasharray="14 12" stroke-linecap="round"/>
  
  <!-- Corner stars (big) -->
  <circle cx="0" cy="0" r="40" fill="#0f1a28"/>
  <circle cx="512" cy="0" r="40" fill="#0f1a28"/>
  <circle cx="512" cy="512" r="40" fill="#0f1a28"/>
  <circle cx="0" cy="512" r="40" fill="#0f1a28"/>
  
  <!-- Edge stars -->
  <circle cx="256" cy="0" r="28" fill="#1a2a40"/>
  <circle cx="512" cy="256" r="28" fill="#1a2a40"/>
  <circle cx="256" cy="512" r="28" fill="#1a2a40"/>
  <circle cx="0" cy="256" r="28" fill="#1a2a40"/>
  
  <!-- Center -->
  <circle cx="256" cy="256" r="60" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="32" fill="url(#core)"/>
  <circle cx="248" cy="248" r="12" fill="rgba(255,255,255,0.9)"/>
</svg>