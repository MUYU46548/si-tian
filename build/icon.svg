<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#e8c66a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8c66a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="50%" stop-color="#e8c66a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
  </defs>
  <!-- Light background: full square (no rounded corners = no dead space) -->
  <rect x="0" y="0" width="512" height="512" fill="#eef1f6"/>
  <!-- Thin border -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#3a4a62" stroke-width="4"/>
  <!-- Grid: THICK lines spanning 16-496 (94% coverage) -->
  <line x1="16" y1="16" x2="496" y2="16" stroke="rgba(40,80,130,0.8)" stroke-width="18" stroke-linecap="round"/>
  <line x1="16" y1="256" x2="496" y2="256" stroke="rgba(40,80,130,0.8)" stroke-width="18" stroke-linecap="round"/>
  <line x1="16" y1="496" x2="496" y2="496" stroke="rgba(40,80,130,0.8)" stroke-width="18" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="16" y2="496" stroke="rgba(40,80,130,0.8)" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="16" x2="256" y2="496" stroke="rgba(40,80,130,0.8)" stroke-width="18" stroke-linecap="round"/>
  <line x1="496" y1="16" x2="496" y2="496" stroke="rgba(40,80,130,0.8)" stroke-width="18" stroke-linecap="round"/>
  <!-- Diagonals -->
  <line x1="16" y1="16" x2="496" y2="496" stroke="rgba(100,60,140,0.6)" stroke-width="9" stroke-dasharray="14 10" stroke-linecap="round"/>
  <line x1="496" y1="16" x2="16" y2="496" stroke="rgba(100,60,140,0.6)" stroke-width="9" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Corner stars: large, at grid intersections -->
  <circle cx="16" cy="16" r="30" fill="#2a3a52"/>
  <circle cx="496" cy="16" r="30" fill="#2a3a52"/>
  <circle cx="496" cy="496" r="30" fill="#2a3a52"/>
  <circle cx="16" cy="496" r="30" fill="#2a3a52"/>
  <!-- Edge stars: midpoints of grid edges -->
  <circle cx="256" cy="16" r="20" fill="rgba(42,58,82,0.95)"/>
  <circle cx="496" cy="256" r="20" fill="rgba(42,58,82,0.95)"/>
  <circle cx="256" cy="496" r="20" fill="rgba(42,58,82,0.95)"/>
  <circle cx="16" cy="256" r="20" fill="rgba(42,58,82,0.95)"/>
  <!-- Center: glow + core + specular -->
  <circle cx="256" cy="256" r="56" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="url(#core)"/>
  <circle cx="250" cy="250" r="10" fill="rgba(255,255,255,0.8)"/>
</svg>