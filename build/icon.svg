<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#e8c66a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8c66a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="50%" stop-color="#e8c66a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
  </defs>
  <!-- Light background: full square -->
  <rect x="0" y="0" width="512" height="512" fill="#eef1f6"/>
  <!-- Thin border -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#3a4a62" stroke-width="3"/>
  <!-- Grid: lines spanning 28-484 (93% coverage), thinner width 8 -->
  <line x1="28" y1="28" x2="484" y2="28" stroke="rgba(40,80,130,0.8)" stroke-width="8" stroke-linecap="round"/>
  <line x1="28" y1="256" x2="484" y2="256" stroke="rgba(40,80,130,0.8)" stroke-width="8" stroke-linecap="round"/>
  <line x1="28" y1="484" x2="484" y2="484" stroke="rgba(40,80,130,0.8)" stroke-width="8" stroke-linecap="round"/>
  <line x1="28" y1="28" x2="28" y2="484" stroke="rgba(40,80,130,0.8)" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="28" x2="256" y2="484" stroke="rgba(40,80,130,0.8)" stroke-width="8" stroke-linecap="round"/>
  <line x1="484" y1="28" x2="484" y2="484" stroke="rgba(40,80,130,0.8)" stroke-width="8" stroke-linecap="round"/>
  <!-- Diagonals -->
  <line x1="28" y1="28" x2="484" y2="484" stroke="rgba(100,60,140,0.6)" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
  <line x1="484" y1="28" x2="28" y2="484" stroke="rgba(100,60,140,0.6)" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Corner stars: large, at grid intersections, fully visible -->
  <circle cx="28" cy="28" r="28" fill="#2a3a52"/>
  <circle cx="484" cy="28" r="28" fill="#2a3a52"/>
  <circle cx="484" cy="484" r="28" fill="#2a3a52"/>
  <circle cx="28" cy="484" r="28" fill="#2a3a52"/>
  <!-- Edge stars: midpoints of grid edges -->
  <circle cx="256" cy="28" r="18" fill="rgba(42,58,82,0.95)"/>
  <circle cx="484" cy="256" r="18" fill="rgba(42,58,82,0.95)"/>
  <circle cx="256" cy="484" r="18" fill="rgba(42,58,82,0.95)"/>
  <circle cx="28" cy="256" r="18" fill="rgba(42,58,82,0.95)"/>
  <!-- Center: glow + core + specular -->
  <circle cx="256" cy="256" r="56" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="url(#core)"/>
  <circle cx="250" cy="250" r="10" fill="rgba(255,255,255,0.8)"/>
</svg>